services:
  dz-app:
    image: eavfeavf/dz-news:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dz-app
    restart: unless-stopped

    env_file:
      - .env

    # Nepotrebujeme lebo zdieľame hosts network.....
    #ports:
    #  - "5088:5088"

    # Pridané: Host network pre priamy prístup k Synology MySQL
    network_mode: "host"

    environment:
      TZ: "${TZ:-Africa/Algiers}"

      # Zmena: Použite localhost keď je network_mode: host
      DB_HOST: "${DB_HOST:-127.0.0.1}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASS: "${DB_PASS}"

      APP_ENV: "${APP_ENV:-prod}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"


      # Pridané: SQLAlchemy pool settings
      SQLALCHEMY_POOL_RECYCLE: "280"
      SQLALCHEMY_POOL_PRE_PING: "true"

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./templates:/app/templates
      - ./config:/app/config
      - ./static:/app/static
      - ./bundle:/app/bundle

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket,os; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1', int(os.getenv('FLASK_PORT','5088')))); s.close()"
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  dz-scheduler:
    image: eavfeavf/dz-news:latest
    container_name: dz-scheduler
    restart: unless-stopped
    network_mode: "host"

    env_file:
      - .env

    environment:
      TZ: "${TZ:-Africa/Algiers}"

    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./bundle:/app/bundle

    command: ["python", "scheduler.py"]

  # Vzdialený MCP server pre claude.ai / aplikáciu Claude (mcp_server.py --http) — volá API dz-app
  # na 127.0.0.1:5088, počúva len na 127.0.0.1:5090; von cez reverzný proxy DSM s HTTPS (DEPLOYMENT.md)
  dz-mcp:
    image: eavfeavf/dz-news:latest
    container_name: dz-mcp
    restart: unless-stopped
    network_mode: "host"

    env_file:
      - .env

    environment:
      TZ: "${TZ:-Africa/Algiers}"
      DZ_API_URL: "http://127.0.0.1:${FLASK_PORT:-5088}"
      MCP_PORT: "${MCP_PORT:-5090}"

    entrypoint: []
    command: ["python", "mcp_server.py", "--http"]
